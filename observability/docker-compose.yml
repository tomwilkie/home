services:
  alloy:
    image: grafana/alloy:v1.14.2
    restart: unless-stopped
    pid: "host"
    network_mode: host
    env_file: ".env"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - seccomp:unconfined
    volumes:
      # Node exporter mounts
      - /proc:/host/proc:ro,rslave
      - /sys:/host/sys:ro,rslave
      - /dev:/host/dev:ro,rslave

      # cAdvisor mounts
      - /proc:/proc:ro,rslave
      - /sys:/sys:ro,rslave
      - /var/run:/var/run:rw
      # Docker root (non-standard on HAOS) mapped to where cAdvisor expects it
      - /mnt/data/docker:/var/lib/docker:ro
      # Also expose at the host path so cAdvisor can resolve host-rooted overlayfs paths
      - /mnt/data/docker:/mnt/data/docker:ro

      # Host identity files
      - /etc/hostname:/etc/hostname:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/os-release:/etc/os-release:ro
      # Docker socket — container metrics + log discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs — journal (volatile) and traditional /var/log
      - /var/log/journal:/var/log/journal:ro,rslave
      - /var/log:/var/log:ro,rslave
      # Alloy config + persistent state
      - /mnt/data/supervisor/homeassistant/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/12345 && printf \"GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      # Required for loki.source.syslog "raw" format (UniFi sends CEF, not
      # RFC-compliant syslog). See alloy/config.alloy → loki.source.syslog.unifi.
      - --stability.level=experimental

volumes:
  alloy-data:
