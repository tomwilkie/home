views:
   -  title: Home
      path: home
      icon: mdi:office-building
      type: sections
      sections:
         -  type: grid
            cards:
               -  type: heading
                  heading: My Home
                  heading_style: title
                  icon: mdi:home
                  badges:
                     -  type: entity
                        entity: binary_sensor.house_occupancy
                        show_state: false
                        show_icon: true
                        color: state
                        tap_action:
                            action: more-info
               -  type: custom:mushroom-select-card
                  entity: input_select.tom_room_selector
                  primary_info: none
                  secondary_info: none
                  layout: horizontal
                  icon: mdi:office-building
                  grid_options:
                      columns: 6
                      rows: 1
               -  type: custom:mushroom-template-card
                  entity: person.tom_wilkie
                  secondary: "{% if is_state('person.tom_wilkie', 'home') %}\n  {{
                      states('sensor.tom_s_iphone_area') }}\n{% else %}\n  {% set
                      loc = states('sensor.toms_iphone_geocoded_location') %}\n  {%
                      if loc not in ('unavailable', 'unknown', '') %}\n    {% set
                      parts = loc.split('\\n') | map('trim') | list %}\n    {{ parts[0]
                      ~ ', ' ~ parts[1] if parts | length >= 2 else parts[0] }}\n\
                      \  {% else %}\n    Away\n  {% endif %}\n{% endif %}"
                  grid_options:
                      columns: 3
                      rows: 1
                  features_position: bottom
                  primary: Tom
               -  type: custom:mushroom-template-card
                  entity: person.rachana_shanbhogue
                  secondary: "{% if is_state('person.rachana_shanbhogue', 'home')
                      %}\n  {{ states('sensor.rachanas_iphone_area') }}\n{% else %}\n\
                      \  {% set loc = states('sensor.rachanas_iphone_geocoded_location')
                      %}\n  {% if loc not in ('unavailable', 'unknown', '') %}\n \
                      \   {% set parts = loc.split('\\n') | map('trim') | list %}\n\
                      \    {{ parts[0] ~ ', ' ~ parts[1] if parts | length >= 2 else
                      parts[0] }}\n  {% else %}\n    Away\n  {% endif %}\n{% endif
                      %}\n"
                  grid_options:
                      columns: 3
                      rows: 1
                  features_position: bottom
                  primary: Rachana
            column_span: 3
         -  type: grid
            cards:
               -  type: heading
                  heading: Basement
                  heading_style: title
                  icon: mdi:home-floor-b
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.basement_multisensor_air_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.basement_multisensor_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.basement_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: media-control
                  entity: media_player.basement_home_cinema
                  grid_options:
                      columns: 6
                      rows: 2
               -  type: tile
                  entity: automation.basement_lights
                  layout_options:
                      grid_columns: 2
                      grid_rows: 1
                  name: Auto Lights
                  show_entity_picture: false
                  tap_action:
                      action: toggle
                  icon: mdi:ceiling-light
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('Basement')) | selectattr('domain',
                      '==', 'light') | selectattr('state', '==', 'on') | selectattr('entity_id',
                      'in', label_entity_ids) | list | count > 0  %}\n  yellow\n{%
                      else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: basement
                          label_id_filter: room-light
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: vacuum.basement_roomba
                  vertical: false
                  features:
                     -  type: vacuum-commands
                        commands:
                           -  start_pause
                           -  return_home
                  features_position: inline
               -  type: custom:mushroom-template-card
                  primary: Washing Machine
                  secondary: '{{ states("input_select.washing_machine_state") | title
                      }}'
                  icon: "{% if is_state(\"input_select.washing_machine_state\", \"\
                      running\") %}\n  mdi:washing-machine\n{% elif is_state(\"input_select.washing_machine_state\"\
                      , \"finished\") %}\n  mdi:washing-machine-alert\n{% else %}\n\
                      \  mdi:washing-machine-off\n{% endif %}\n"
                  icon_color: "{% if is_state(\"input_select.washing_machine_state\"\
                      , \"running\") %}\n  blue\n{% elif is_state(\"input_select.washing_machine_state\"\
                      , \"finished\") %}\n  orange\n{% else %}\n  disabled\n{% endif
                      %}\n"
                  badge_icon: "{% if is_state(\"input_select.washing_machine_state\"\
                      , \"finished\") %}\n  mdi:basket\n{% endif %}\n"
                  badge_color: orange
                  entity: input_select.washing_machine_state
                  tap_action:
                      action: more-info
               -  type: custom:mushroom-template-card
                  primary: Tumble Dryer
                  secondary: '{{ states("input_select.tumble_dryer_state") | title
                      }}'
                  icon: "{% if is_state(\"input_select.tumble_dryer_state\", \"active\"\
                      ) %}\n  mdi:tumble-dryer\n{% elif is_state(\"input_select.tumble_dryer_state\"\
                      , \"finished\") %}\n  mdi:tumble-dryer-alert\n{% else %}\n \
                      \ mdi:tumble-dryer-off\n{% endif %}\n"
                  icon_color: "{% if is_state(\"input_select.tumble_dryer_state\"\
                      , \"active\") %}\n  blue\n{% elif is_state(\"input_select.tumble_dryer_state\"\
                      , \"finished\") %}\n  orange\n{% else %}\n  disabled\n{% endif
                      %}\n"
                  badge_icon: "{% if is_state(\"input_select.tumble_dryer_state\"\
                      , \"finished\") %}\n  mdi:basket\n{% endif %}\n"
                  badge_color: orange
                  entity: input_select.tumble_dryer_state
                  tap_action:
                      action: more-info
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Basement
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: basement
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
         -  type: grid
            cards:
               -  type: heading
                  heading: Kitchen
                  heading_style: title
                  icon: mdi:faucet-variant
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.kitchen_netatmo_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.kitchen_netatmo_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.kitchen_netatmo_co2
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.kitchen_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: vacuum.kitchen_vacuum
                  vertical: false
                  features:
                     -  type: vacuum-commands
                        commands:
                           -  start_pause
                           -  return_home
                  features_position: inline
               -  type: tile
                  entity: media_player.kitchen_display
                  features_position: inline
                  vertical: false
                  grid_options:
                      columns: 12
                      rows: 1
                  features:
                     -  type: media-player-volume-slider
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Kitchen
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: kitchen
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
         -  type: grid
            cards:
               -  type: heading
                  heading: Living Room
                  heading_style: title
                  icon: mdi:sofa
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: 
                            sensor.living_room_environmental_sensor_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.living_room_environmental_sensor_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.living_room_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: media-control
                  grid_options:
                      columns: 6
                      rows: 2
                  entity: media_player.living_room_apple_tv
               -  type: media-control
                  grid_options:
                      columns: 6
                      rows: 2
                  entity: media_player.living_room_arylic_lp10_music_assistant
               -  type: tile
                  entity: automation.living_room_lights
                  layout_options:
                      grid_columns: 2
                      grid_rows: 1
                  name: Auto Lights
                  tap_action:
                      action: toggle
                  icon: mdi:ceiling-light
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('Living Room')) | selectattr('domain',
                      '==', 'light') | selectattr('state', '==', 'on') | selectattr('entity_id',
                      'in', label_entity_ids) | list | count > 0  %}\n  yellow\n{%
                      else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: living_room
                          label_id_filter: room-light
                      target: {}
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: vacuum.living_room_roomba
                  vertical: false
                  features:
                     -  type: vacuum-commands
                        commands:
                           -  start_pause
                           -  return_home
                  features_position: inline
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Living Room
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: living_room
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
         -  type: grid
            cards:
               -  type: heading
                  heading: Master Bedroom
                  heading_style: title
                  icon: mdi:bed
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.master_bedroom_netatmo_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.master_bedroom_netatmo_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.master_bedroom_netatmo_co2
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.master_bedroom_occupancy
                        tap_action:
                            action: more-info
               -  type: media-control
                  grid_options:
                      columns: 6
                      rows: 1
                  entity: media_player.master_bedroom_wiim_sound_speaker_ma_player
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('Master Bedroom')) | selectattr('domain',
                      '==', 'light') | selectattr('state', '==', 'on') | selectattr('entity_id',
                      'in', label_entity_ids) | list | count > 0  %}\n  yellow\n{%
                      else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: master_bedroom
                          label_id_filter: room-light
                  grid_options:
                      columns: 6
                      rows: 1
               -  features:
                     -  type: fan-speed
                  type: tile
                  entity: fan.master_bedroom_dyson_fan
                  name: Dyson Fan
                  features_position: inline
                  vertical: false
                  grid_options:
                      columns: 12
                      rows: 1
                  hide_state: false
               -  type: tile
                  entity: climate.master_bedroom_aircon
                  icon: ''
                  hide_state: false
                  tap_action:
                      action: call-service
                      service: automation.trigger
                      target:
                          entity_id: automation.turn_on_bedroom_ac_for_1hr
                      data:
                          skip_condition: true
                  name: Aircon
                  state_content:
                     -  state
                     -  temperature
                  features_position: inline
                  vertical: false
                  grid_options:
                      columns: 12
                      rows: 1
                  features:
                     -  style: dropdown
                        type: climate-hvac-modes
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: cover.master_bedroom_norman_hub_all_shutters
                  name: Shutters
                  hide_state: false
                  vertical: false
                  features:
                     -  type: cover-open-close
                  features_position: inline
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: switch.master_bedroom_electric_blanket
                  name: Electric Blanket
                  show_entity_picture: false
                  vertical: false
                  features:
                     -  type: toggle
                  features_position: inline
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Master Bedroom
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: master_bedroom
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
         -  type: grid
            cards:
               -  type: heading
                  heading: Nursery
                  heading_style: title
                  icon: mdi:cradle
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.nursery_netatmo_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.nursery_netatmo_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.nursery_netatmo_co2
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.nursery_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('nursery')) | selectattr('domain',
                      '==', 'light') | selectattr('state', '==', 'on') | selectattr('entity_id',
                      'in', label_entity_ids) | list | count > 0  %}\n  yellow\n{%
                      else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: nursery
                          label_id_filter: room-light
               -  type: tile
                  entity: automation.nursery_lights
                  layout_options:
                      grid_columns: 2
                      grid_rows: 1
                  name: Auto Lights
                  tap_action:
                      action: toggle
                  icon: mdi:ceiling-light
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Nursery
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: nursery
         -  type: grid
            cards:
               -  type: heading
                  heading: Tom's Office
                  heading_style: title
                  icon: mdi:chair-rolling
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.toms_office_netatmo_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.toms_office_netatmo_humidity
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: sensor.toms_office_netatmo_co2
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.toms_office_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: media-control
                  entity: media_player.toms_office_arylic_lp10_ma_player
                  grid_options:
                      columns: 6
                      rows: 2
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('toms_office')) | selectattr('domain',
                      '==', 'light') | selectattr('state', '==', 'on') | selectattr('entity_id',
                      'in', label_entity_ids) | list | count > 0  %}\n  yellow\n{%
                      else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: toms_office
                          label_id_filter: room-light
               -  type: tile
                  entity: automation.toms_office_lights
                  layout_options:
                      grid_columns: 2
                      grid_rows: 1
                  name: Auto Lights
                  icon: mdi:ceiling-light
                  tap_action:
                      action: toggle
               -  type: tile
                  entity: vacuum.toms_office_roomba
                  vertical: false
                  features:
                     -  type: vacuum-commands
                        commands:
                           -  start_pause
                           -  return_home
                  features_position: inline
               -  type: tile
                  entity: climate.toms_office_aircon
                  name: Aircon
                  icon: mdi:air-conditioner
                  state_content:
                     -  state
                     -  temperature
                  features_position: inline
                  vertical: false
                  grid_options:
                      columns: 12
                      rows: 1
                  features:
                     -  style: dropdown
                        type: climate-hvac-modes
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Tom's Office
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: toms_office
         -  type: grid
            cards:
               -  type: heading
                  heading: Master Bathroom
                  heading_style: title
                  icon: mdi:toilet
                  badges:
                     -  type: entity
                        show_state: true
                        show_icon: true
                        entity: 
                            sensor.master_bathroom_motion_sensor_air_temperature
                        tap_action:
                            action: more-info
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.master_bathroom_occupancy
                        tap_action:
                            action: more-info
               -  type: tile
                  grid_options:
                      columns: 12
                      rows: 1
                  entity: cover.master_bathroom_veluxes
                  name: Veluxes
                  state_content: state
                  vertical: false
                  features:
                     -  type: cover-open-close
                  features_position: inline
               -  type: custom:mushroom-template-card
                  grid_options:
                      columns: 12
                      rows: 1
                  primary: Hot Water
                  secondary: "{% if is_state('binary_sensor.basement_hotwater_state',
                      'on') %}\n  Heating (tap to stop)\n{% else %}\n  Last on {{
                      relative_time(states.binary_sensor.basement_hotwater_state.last_changed)
                      }} ago (tap to boost)\n{% endif %}\n"
                  icon: "{% if is_state('binary_sensor.basement_hotwater_state', 'on')
                      %}\n  mdi:water-boiler\n{% else %}\n  mdi:water-boiler-off\n\
                      {% endif %}\n"
                  icon_color: "{% if is_state('binary_sensor.basement_hotwater_state',
                      'on') %}\n  orange\n{% else %}\n  grey\n{% endif %}\n"
                  entity: binary_sensor.basement_hotwater_state
                  tap_action:
                      action: perform-action
                      perform_action: script.toggle_hot_water_boost
                  hold_action:
                      action: more-info
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Master Bathroom
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: master_bathroom
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
         -  type: grid
            cards:
               -  type: heading
                  heading: Rear Guest Room
                  heading_style: title
                  icon: mdi:bed-outline
                  badges:
                     -  type: entity
                        show_state: false
                        show_icon: true
                        entity: binary_sensor.rear_guest_room_occupancy
                        color: state
                        tap_action:
                            action: more-info
               -  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: ''
                  icon: mdi:lightbulb
                  icon_color: "{% set label_entity_ids = label_entities('room-light')
                      | list %}\n{% if expand(area_entities('Rear Guest Room')) |
                      selectattr('domain', '==', 'light') | selectattr('state', '==',
                      'on') | selectattr('entity_id', 'in', label_entity_ids) | list
                      | count > 0  %}\n  yellow\n{% else %}\n  grey\n{% endif %}"
                  tap_action:
                      action: perform-action
                      perform_action: script.call_service
                      data:
                          service: light.toggle
                          domain: light
                          area_id_filter: rear_guest_room
                          label_id_filter: room-light
               -  type: tile
                  entity: automation.rear_guest_room_lights
                  layout_options:
                      grid_columns: 2
                      grid_rows: 1
                  name: Auto Lights
                  tap_action:
                      action: toggle
                  icon: mdi:ceiling-light
            visibility:
               -  condition: or
                  conditions:
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: Rear Guest Room
                     -  condition: and
                        conditions:
                           -  condition: state
                              entity: input_select.tom_room_selector
                              state: Auto
                           -  condition: state
                              entity: sensor.tom_s_room
                              state: rear_guest_room
                     -  condition: state
                        entity: input_select.tom_room_selector
                        state: All
      max_columns: 3
      cards: []
   -  theme: Backend-selected
      title: Lighting
      icon: mdi:ceiling-light-multiple
      cards:
         -  type: custom:auto-entities
            card:
                type: entities
                title: Basement
                show_header_toggle: true
            filter:
                include:
                   -  domain: light
                      area: basement
                      label: room-light
                      options:
                          secondary_info: entity-id
